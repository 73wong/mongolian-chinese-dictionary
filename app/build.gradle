plugins { id 'com.android.application' }
android {
    namespace 'org.example.mongoldictionary'
    compileSdk 35
    defaultConfig {
        applicationId 'org.example.mongoldictionary'
        testInstrumentationRunner "org.example.mongoldictionary.RenderingChecks"
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '1.1.1-offline'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// A clean source checkout must restore the matching offline Release asset first.
tasks.register('verifyOfflineData') {
    doLast {
        def dictionary = file('src/main/assets/dictionary.json')
        def audio = file('src/main/assets/audio')
        if (!dictionary.isFile() || !audio.isDirectory()) {
            throw new GradleException('Offline data missing. Run: python3 tools/restore_data.py /path/to/dictionary-data.zip')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyOfflineData') }

// Compile audited corrections and indexes before packaging the offline database.
tasks.register('buildDictionaryDatabase', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build_dictionary_db.py'
    inputs.file(rootProject.file('tools/build_dictionary_db.py'))
    inputs.files(fileTree('src/main/assets') { include '*.json'; exclude 'ui-en.json', 'input-guide.json' })
    outputs.files(file('src/main/assets/dictionary.db'), file('src/main/assets/dictionary-db-version.txt'))
}
tasks.named('preBuild').configure { dependsOn('buildDictionaryDatabase') }
